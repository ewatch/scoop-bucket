name: Update manifest

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

env:
  MANIFEST_PATH: bucket/snow-cli.json
  MAIN_REPO: ewatch/snow-cli
  TARGET: x86_64-pc-windows-msvc

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update manifest to the latest release
        id: update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag=$(gh api "repos/${MAIN_REPO}/releases/latest" --jq '.tag_name')
          version="${tag#v}"
          current=$(jq -r '.version' "${MANIFEST_PATH}")
          echo "latest=${version} current=${current}"

          if [[ "${version}" == "${current}" ]]; then
            echo "Manifest already at ${version}."
            exit 0
          fi

          asset="snow-cli-${version}-${TARGET}.zip"
          base="https://github.com/${MAIN_REPO}/releases/download/${tag}"
          # Take the hash from the release's own SHA256SUMS so the manifest
          # pins exactly what the release workflow published.
          hash=$(curl -fsSL "${base}/SHA256SUMS" | awk -v f="${asset}" '$2 == f { print $1 }')
          if [[ ! "${hash}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::No SHA-256 for ${asset} in ${base}/SHA256SUMS" >&2
            exit 1
          fi

          jq --indent 4 \
            --arg v "${version}" --arg u "${base}/${asset}" --arg h "${hash}" \
            '.version = $v
             | .architecture."64bit".url = $u
             | .architecture."64bit".hash = $h' \
            "${MANIFEST_PATH}" > manifest.tmp
          mv manifest.tmp "${MANIFEST_PATH}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Commit and push
        if: steps.update.outputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${MANIFEST_PATH}"
          git commit -m "snow-cli: update to ${{ steps.update.outputs.version }}"
          git push
